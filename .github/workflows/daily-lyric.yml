name: Daily lyric

on:
  schedule:
    # GitHub runs schedules in UTC and sometimes late or not at all, so try every hour from 8am to 3pm Pacific.
    # The script posts once, at or after 9 am Pacific, and skips if today's card is already up.
    - cron: "5 16-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: prepare the post but don't publish it"
        type: boolean
        default: true
      force:
        description: "Ignore the time-of-day check"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: daily-lyric

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make today's Reel
        # If Reels are on and today's line has a song clip, render the Reel and
        # publish it on the reels branch. Any problem here falls back to the still card.
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          [ "$(python3 -c 'import json;print(json.load(open("config.json")).get("reels",False))')" = "True" ] || { echo "Reels are off."; exit 0; }
          [ "$FORCE" = "true" ] || [ "$(TZ=America/Los_Angeles date +%-H)" -ge "$(python3 -c 'import json;print(json.load(open("config.json"))["post_hour_pacific"])')" ] || { echo "Not time yet."; exit 0; }
          read KIND DAY < <(python3 scripts/schedule.py)
          [ "$KIND" = "reel" ] || { echo "Today is a $KIND day."; exit 0; }
          CLIP=$(printf "clips/%03d.m4a" "$DAY")
          [ -f "$CLIP" ] || { echo "No song clip for day $DAY; posting the still card."; exit 0; }
          npm install --no-save playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg >/dev/null
          NAME="reel-$(TZ=America/Los_Angeles date +%F)-$(printf %03d "$DAY").mp4"
          scripts/make_reel.sh "$DAY" "/tmp/$NAME"
          mkdir -p /tmp/rb && cp "/tmp/$NAME" /tmp/rb/ && cd /tmp/rb && git init -q -b reels \
            && git -c user.name=wch -c user.email=actions@users.noreply.github.com add -A \
            && git -c user.name=wch -c user.email=actions@users.noreply.github.com commit -qm "Reel for day $DAY" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:reels
          sleep 20
          echo "REEL_URL=https://raw.githubusercontent.com/${{ github.repository }}/reels/$NAME" >> "$GITHUB_ENV"
      - name: Post today's card
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841455416450834' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python scripts/post.py
      - name: Open an issue if posting failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Daily lyric didn't post on $(TZ=America/Los_Angeles date +%F)" \
            --body "The scheduled run failed. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  stories:
    # Today's lyric horoscope (12 signs) as Instagram Stories, right after the card.
    needs: post
    if: always()
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841455416450834' }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - name: Is it time?
        id: gate
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          c = json.load(open("config.json")); now = datetime.now(ZoneInfo("America/Los_Angeles"))
          force = os.environ.get("FORCE") == "true"
          import sys; sys.path.insert(0, "scripts"); from schedule import plan
          go = not c.get("paused") and not c.get("stories_paused") and (force or (
              plan(now.date(), c)["kind"] == "horoscope" and now.hour >= c["post_hour_pacific"]))
          print(f"go={'yes' if go else 'no'}"); print(f"today={now:%Y-%m-%d}")
          PY
      - name: Get the stories branch
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config --global user.name "wch-daily-lyric"; git config --global user.email "actions@users.noreply.github.com"
          git clone -q --depth 1 --branch stories "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" st \
            || { mkdir -p st && git -C st init -q -b stories; }
          if [ -f "st/posted-${{ steps.gate.outputs.today }}" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Today's horoscope Stories are already up."; echo "DONE=1" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes' && env.DONE != '1'
        with:
          node-version: "22"
      - name: Render today's horoscope cards
        if: steps.gate.outputs.go == 'yes' && env.DONE != '1'
        run: |
          if [ ! -f "st/${{ steps.gate.outputs.today }}.json" ]; then
            npm install --no-save playwright@1 && npx playwright install --with-deps chromium
            mkdir -p cards && node scripts/horoscope_cards.mjs cards
            rm -rf st && mkdir st && cp cards/* st/ && cd st
            git init -q -b stories && git add -A && git commit -qm "Horoscope cards for ${{ steps.gate.outputs.today }}"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:stories
            sleep 20   # let raw.githubusercontent.com catch up
          fi
      - name: Post the Stories
        if: steps.gate.outputs.go == 'yes' && env.DONE != '1'
        run: |
          python scripts/post_stories.py st
          if [ "$DRY_RUN" != "true" ]; then
            cd st && git add -A && git commit -qm "Posted ${{ steps.gate.outputs.today }}" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:stories
          fi
      - name: Open an issue if the Stories failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Horoscope Stories didn't post on $(TZ=America/Los_Angeles date +%F)" \
            --body "Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
