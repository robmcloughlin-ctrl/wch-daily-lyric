name: Refresh Instagram key

# Instagram keys expire after about 60 days. This renews it every Monday
# and saves the new key back into the repository's secrets.
on:
  schedule:
    - cron: "30 15 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renew the key
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sSf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Instagram key renewed."
      - name: Open an issue if renewal failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Instagram key renewal failed on $(date +%F)" \
            --body "Posting will stop when the current key expires. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
